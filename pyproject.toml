[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "byo-mcp-cli"
version = "0.1.0"
description = "Bring Your Own MCP CLI - Turn any script into an MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Pranav", email = "pranav@example.com"}
]
dependencies = [
    "mcp>=1.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
byo-mcp = "byo_mcp.main:main"

[tool.setuptools.packages.find]
where = ["src"]
